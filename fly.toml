app = "mispricing-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # One shared vCPU cannot serve a live simulation. Measured: 36.5s for 100
  # sims x 3 strategies, and 1000 x 1 exceeded 894s against a 121s linear
  # prediction once the CPU burst budget ran out. Throughput is also
  # history-dependent -- the same request took 36.5s rested and over 360s
  # after a heavy run -- so no request cap can bound wall-clock time here.
  # Disabled until the pick loop is optimised (docs/CHANGE_LEDGER.md).
  FFSIM_LIVE_SIM = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays warm. Scaling to zero costs the first visitor ~5s of
  # blank tab while the machine boots, all of it before the first byte, so
  # there is nothing to render a spinner into.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # pandas + numpy import is ~150MB RSS before any work, and api/main.py loads
  # both player pools at import time, so 512MB leaves no headroom for a
  # 1,000-sim run.
  memory_mb = 1024
